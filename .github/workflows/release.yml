name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build extension package
        run: pnpm run package

      - name: Lint extension manifest (web-ext)
        run: pnpm run lint:extension

      - name: Build Chrome extension package
        run: pnpm run package:chrome

      - name: Zip Chrome extension
        run: cd dist/chrome && zip -r ../lemon-juice-chrome.zip manifest.json popup.html popup.js detectors.js scan-helpers.js scan.js icons

      - name: Check packaged artifacts
        run: pnpm run check:packages

      - name: Create GitHub release with asset
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/lemon-juice.zip
            dist/lemon-juice-chrome.zip
